<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="icon" type="image/x-icon" href="/icon.ico" />
    <title>Calibre Reader</title>
    <style>
      body { background-color: #1e1e1e; color: #e1e1e1; font-family: sans-serif; }
      .loading-container {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 9999; transition: opacity 0.5s ease-out;
      }
      .spinner {
        width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid #fff; border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  </head>
  <body class="bg-background text-foreground overflow-hidden">
    <div id="root"></div>
    <div id="loader" class="loading-container">
      <div class="spinner"></div>
      <p style="margin-top: 20px; color: #888; font-size: 0.8rem;">Initializing Reader...</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
