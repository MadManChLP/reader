# Release configuration — the single source of truth for the app version.
#
# `version`  the X.Y.Z version stamped into every build. On each pipeline the
#            CI writes it into package.json, package-lock.json,
#            src-tauri/tauri.conf.json and installer/reader-setup.iss.
#            Dev builds are shown as <version>-dev.<pipeline-id>.
#
# `full_release`
#   false  (normal)  -> only the rolling dev build + SideStore dev channel.
#   true             -> cut a full versioned release: the pipeline builds all
#                       platforms as <version>, publishes the GitLab release
#                       v<version> + SideStore stable channel, then commits the
#                       version bump back to master and resets this flag to
#                       false (commit is marked [skip ci], so no loop).
#
# Normal workflow: bump `version`, set `full_release=true`, commit & push.
# After the pipeline is green, `git pull` — the four files are updated and
# `full_release` is back to false.
version=1.9.3
full_release=false

# Release notes (optional). When release_notes=true, the markdown in
# `release_notes_file` (default RELEASENOTES.md) is prepended to BOTH the dev
# release and — on a full release — the versioned release description. After
# the pipeline runs, release_notes is reset to false and the notes file is
# emptied (one-shot), so write fresh notes each time. If the file is missing
# or empty the release is still published, just without notes.
# Tip: set release_notes=true together with full_release=true so your notes
# land on the versioned release (a dev-only pipeline would consume them first).
release_notes=false
release_notes_file=RELEASENOTES.md

# Skip build: set skip_build=true for a commit that changes nothing that needs
# building (docs, README, comments). The pipeline then does NOT compile, and
# creates NO dev or full release — every build/release job exits immediately.
# The only action is a [skip ci] commit that resets skip_build back to false,
# so your next normal push builds again. Use it ALONE — don't combine with
# full_release/release_notes (those are left untouched and would fire on your
# next push).
skip_build=false
